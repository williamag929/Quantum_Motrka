<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Motkra</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1e1e1e;
    --bg2:       #252526;
    --bg3:       #2d2d2d;
    --border:    #3c3c3c;
    --fg:        #cccccc;
    --fg-dim:    #888888;
    --blue:      #007acc;
    --blue-bg:   #0d3a58;
    --blue-hi:   #9cdcfe;
    --teal:      #00bc88;
    --green-bg:  #1a3a1a;
    --err:       #f48771;
    --red:       #e05252;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  /* ── Title bar ── */
  #titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px 6px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    -webkit-app-region: drag;
  }
  #titlebar-left { display: flex; align-items: center; gap: 8px; }
  #titlebar-name {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--teal);
  }
  #model-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    background: var(--blue-bg);
    color: var(--blue-hi);
  }
  /* Listening indicator in title bar */
  #listen-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    display: none;
    animation: pulse-dot 1.2s ease-in-out infinite;
  }
  #listen-dot.active { display: inline-block; }
  @keyframes pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.7); } }

  #titlebar-right {
    display: flex;
    align-items: center;
    gap: 4px;
    -webkit-app-region: no-drag;
  }
  #vscode-btn, #close-btn, #tts-btn, #clear-btn {
    background: none;
    border: none;
    color: var(--fg);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 7px;
    border-radius: 3px;
    opacity: 0.5;
    line-height: 1;
  }
  #vscode-btn:hover  { opacity: 1; background: #264f78; color: var(--blue-hi); }
  #close-btn:hover   { opacity: 1; background: #5a1d1d; color: var(--err); }
  #tts-btn:hover     { opacity: 1; }
  #tts-btn.active    { opacity: 1; color: var(--teal); }
  #clear-btn:hover   { opacity: 1; background: var(--bg3); color: var(--fg); }
  #clear-btn         { font-size: 11px; }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-app-region: no-drag;
    user-select: text;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }

  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex: 1;
    opacity: 0.4;
    font-size: 12px;
    text-align: center;
  }
  #empty-state .big { font-size: 28px; }

  .msg { display: flex; flex-direction: column; gap: 3px; }
  .msg .label {
    font-size: 10px;
    opacity: 0.45;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .bubble {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
  }
  .msg.user      .bubble { background: var(--blue-bg);  border-color: #1a6fa0; }
  .msg.assistant .bubble { background: var(--green-bg); border-color: #2a5a2a; }
  .msg.error     .bubble { border-color: var(--err); color: var(--err); }

  .bubble pre {
    background: #141414;
    border-radius: 4px;
    padding: 8px;
    overflow-x: auto;
    margin: 4px 0;
    font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace;
    font-size: 11px;
    white-space: pre;
  }
  .bubble code { font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace; font-size: 11px; }
  .bubble strong { color: #fff; }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: currentColor;
    animation: blink .7s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── No-API-key warning ── */
  #no-key-banner {
    display: none;
    padding: 7px 10px;
    background: #5a3a00;
    color: #ffd580;
    font-size: 11px;
    text-align: center;
    flex-shrink: 0;
    border-top: 1px solid #7a5000;
  }
  #no-key-banner.visible { display: block; }

  /* ── Input area ── */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 8px;
    display: flex;
    gap: 6px;
    align-items: flex-end;
    flex-shrink: 0;
    background: var(--bg2);
    -webkit-app-region: no-drag;
  }

  /* Mic button */
  #mic-btn {
    background: none;
    border: none;
    color: var(--fg-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 0 6px;
    height: 36px;
    border-radius: 4px;
    flex-shrink: 0;
    line-height: 1;
    transition: color .15s, background .15s;
  }
  #mic-btn:hover { color: var(--fg); background: var(--bg3); }
  #mic-btn.listening {
    color: var(--red);
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  #mic-btn.no-speech { display: none; }

  #input {
    flex: 1;
    min-height: 36px;
    max-height: 120px;
    resize: none;
    background: var(--bg3);
    color: var(--fg);
    border: 1px solid #555;
    border-radius: 4px;
    padding: 7px 9px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    line-height: 1.4;
    user-select: text;
    transition: border-color .15s;
  }
  #input:focus    { border-color: var(--blue); }
  #input:disabled { opacity: 0.45; }
  #input.listening { border-color: var(--red); }

  #send-btn {
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0 14px;
    height: 36px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #send-btn:hover    { background: #1177bb; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div id="titlebar">
  <div id="titlebar-left">
    <span id="titlebar-name">Motkra</span>
    <span id="model-badge">☁ Claude</span>
    <span id="listen-dot" title="Listening…"></span>
  </div>
  <div id="titlebar-right">
    <button id="vscode-btn" title="Open VS Code">⌨</button>
    <button id="tts-btn"    title="Voice responses: OFF">🔊</button>
    <button id="clear-btn"  title="Clear conversation">↺ clear</button>
    <button id="close-btn"  title="Hide  (Ctrl+Shift+Space to reopen)">✕</button>
  </div>
</div>

<div id="no-key-banner">
  ⚠ ANTHROPIC_API_KEY not set — set it in <code>~/.motkra/.env</code>
</div>

<div id="messages">
  <div id="empty-state">
    <div class="big">🤖</div>
    <div>Speak or type — Motkra is listening</div>
    <div style="opacity:.6;font-size:11px">Ctrl+Shift+Space to toggle  ·  🎙 to use your voice</div>
  </div>
</div>

<div id="input-area">
  <button id="mic-btn" title="Start voice input">🎙</button>
  <textarea id="input" placeholder="Ask Motkra anything…" rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const closeBtn   = document.getElementById('close-btn');
const vsCodeBtn  = document.getElementById('vscode-btn');
const clearBtn   = document.getElementById('clear-btn');
const micBtn     = document.getElementById('mic-btn');
const ttsBtn     = document.getElementById('tts-btn');
const listenDot  = document.getElementById('listen-dot');
const emptyState = document.getElementById('empty-state');
const noKeyBanner= document.getElementById('no-key-banner');

let history   = [];
let curBubble = null;
let busy      = false;

// ── Check API key ─────────────────────────────────────────────────────────
window.motkra.getConfig().then(cfg => {
  if (!cfg.hasApiKey) noKeyBanner.classList.add('visible');
});

// ── Register token stream handler once ───────────────────────────────────
window.motkra.onToken(token => {
  if (!curBubble) return;
  curBubble._raw += token;
  curBubble.innerHTML = renderMarkdown(curBubble._raw) + '<span class="cursor"></span>';
  messagesEl.scrollTop = messagesEl.scrollHeight;
});

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(text) {
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g,
    (_, lang, code) => `<pre><code>${esc(code.trimEnd())}</code></pre>`);
  text = text.replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`);
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g,     '<em>$1</em>');
  return text;
}

function addBubble(role, label) {
  if (emptyState.parentNode) emptyState.remove();
  const wrapper = document.createElement('div');
  wrapper.className = `msg ${role}`;
  const lbl    = document.createElement('div');
  lbl.className   = 'label';
  lbl.textContent = label;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  wrapper.appendChild(lbl);
  wrapper.appendChild(bubble);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

// ── Voice: STT ────────────────────────────────────────────────────────────
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition  = null;
let micActive    = false;
let silenceTimer = null;

if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.continuous     = true;
  recognition.interimResults = true;
  recognition.lang           = navigator.language || 'en-US';

  recognition.onresult = event => {
    let interim = '';
    let finalChunk = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const r = event.results[i];
      if (r.isFinal) finalChunk += r[0].transcript;
      else           interim    += r[0].transcript;
    }

    if (finalChunk) {
      // Append confirmed text to the input
      inputEl.value = (inputEl.value + ' ' + finalChunk).trim();
      inputEl.placeholder = 'Listening…';
      autoGrow();
      clearTimeout(silenceTimer);
      // Auto-submit after 1.5 s of silence
      silenceTimer = setTimeout(() => {
        if (!busy && inputEl.value.trim()) send();
      }, 1500);
    }

    if (interim) {
      // Show interim as placeholder (doesn't modify committed text)
      inputEl.placeholder = interim;
    }
  };

  recognition.onerror = e => {
    if (e.error !== 'aborted' && e.error !== 'no-speech') {
      console.warn('[voice] STT error:', e.error);
    }
    // Restart automatically on recoverable errors
    if (micActive && e.error !== 'not-allowed') {
      setTimeout(() => { try { recognition.start(); } catch {} }, 300);
    } else if (e.error === 'not-allowed') {
      stopMic();
    }
  };

  // Keep alive: restart when it ends naturally while mic is still on
  recognition.onend = () => {
    if (micActive) { try { recognition.start(); } catch {} }
  };
} else {
  micBtn.classList.add('no-speech');
}

function startMic() {
  if (!recognition || micActive) return;
  micActive = true;
  micBtn.classList.add('listening');
  micBtn.title = 'Stop listening  (click to mute)';
  inputEl.classList.add('listening');
  inputEl.placeholder = 'Listening…';
  listenDot.classList.add('active');
  try { recognition.start(); } catch {}
}

function stopMic() {
  if (!recognition) return;
  micActive = false;
  clearTimeout(silenceTimer);
  micBtn.classList.remove('listening');
  micBtn.title = 'Start voice input';
  inputEl.classList.remove('listening');
  inputEl.placeholder = 'Ask Motkra anything…';
  listenDot.classList.remove('active');
  try { recognition.stop(); } catch {}
}

micBtn.addEventListener('click', () => {
  if (micActive) stopMic(); else startMic();
});

// ── Voice: TTS ────────────────────────────────────────────────────────────
let ttsEnabled = false;

ttsBtn.addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  ttsBtn.classList.toggle('active', ttsEnabled);
  ttsBtn.title = ttsEnabled ? 'Voice responses: ON  (click to mute)' : 'Voice responses: OFF';
  if (!ttsEnabled) window.speechSynthesis.cancel();
});

/**
 * Speak a response — strips code fences, inline code, and markdown symbols.
 * Silently skips if TTS is off or the text is code-heavy.
 */
function speak(text) {
  if (!ttsEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();

  const prose = text
    .replace(/```[\s\S]*?```/g, '')          // remove code fences entirely
    .replace(/`[^`\n]+`/g, '')               // remove inline code
    .replace(/\*\*?(.+?)\*\*?/g, '$1')       // strip bold/italic markers
    .replace(/#{1,6}\s+/g, '')               // strip headings
    .replace(/^>\s+/gm, '')                  // strip blockquotes
    .replace(/!\[.*?\]\(.*?\)/g, '')         // strip images
    .replace(/\[(.+?)\]\(.*?\)/g, '$1')      // strip links (keep label)
    .replace(/\n{2,}/g, '. ')
    .replace(/\n/g, ' ')
    .trim();

  const words = prose.split(/\s+/).filter(Boolean);
  if (words.length < 4) return;              // too short or all-code — skip
  if (words.length > 200) {
    // Cap to first 200 words so very long responses don't read forever
    const snippet = words.slice(0, 200).join(' ') + '…';
    _doSpeak(snippet);
  } else {
    _doSpeak(prose);
  }
}

function _doSpeak(text) {
  const utt   = new SpeechSynthesisUtterance(text);
  utt.rate    = 1.05;
  utt.pitch   = 0.95;
  // Prefer a natural-sounding voice if available
  const voices = window.speechSynthesis.getVoices();
  const natural = voices.find(v =>
    /natural|enhanced|premium/i.test(v.name) && v.lang.startsWith('en')
  ) || voices.find(v => v.lang.startsWith('en') && !v.localService === false);
  if (natural) utt.voice = natural;
  window.speechSynthesis.speak(utt);
}

// ── Send ──────────────────────────────────────────────────────────────────
async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  busy = true;
  clearTimeout(silenceTimer);
  sendBtn.disabled = true;
  inputEl.disabled = true;
  if (micActive) inputEl.placeholder = 'Listening…'; // keep placeholder for next turn

  const ub = addBubble('user', 'You');
  ub.innerHTML = renderMarkdown(text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  history.push({ role: 'user', content: text });

  curBubble      = addBubble('assistant', '☁ Claude');
  curBubble._raw = '';
  curBubble.innerHTML = '<span class="cursor"></span>';
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    await window.motkra.queryStream(text, history.slice(0, -1));

    const full = curBubble._raw;
    curBubble.innerHTML = renderMarkdown(full);
    curBubble._raw = '';
    history.push({ role: 'assistant', content: full });
    curBubble = null;

    // Read response aloud if TTS is on
    speak(full);

  } catch (err) {
    if (curBubble) { curBubble.parentNode?.remove(); curBubble = null; }
    const eb = addBubble('error', 'Error');
    eb.textContent = err.message ?? String(err);
    history.pop();
  }

  busy = false;
  sendBtn.disabled = false;
  inputEl.disabled = false;

  // If mic was active, stay in listening mode for the next turn
  if (!micActive) inputEl.focus();

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Controls ──────────────────────────────────────────────────────────────
closeBtn.addEventListener('click', () => {
  stopMic();
  window.speechSynthesis.cancel();
  window.motkra.hideWindow();
});

vsCodeBtn.addEventListener('click', () => window.motkra.openVSCode());

clearBtn.addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
  window.speechSynthesis.cancel();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    stopMic();
    window.speechSynthesis.cancel();
    window.motkra.hideWindow();
  }
});

// ── Input handling ────────────────────────────────────────────────────────
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
inputEl.addEventListener('input', autoGrow);

// Pre-load voices (Chrome initialises the list async)
window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener?.('voiceschanged', () => window.speechSynthesis.getVoices());

inputEl.focus();
</script>
</body>
</html>
